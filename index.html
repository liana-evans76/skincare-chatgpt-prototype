<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>ChatGPT — Makeup Try-On (Prototype)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="device" aria-label="Mobile ChatGPT prototype">
      <div class="shell">
        <header class="status" role="presentation">
          <span class="status__time">9:41</span>
          <span class="status__icons" aria-hidden="true">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M1 3.5C1 2.67157 1.67157 2 2.5 2H3.5C4.32843 2 5 2.67157 5 3.5V8.5C5 9.32843 4.32843 10 3.5 10H2.5C1.67157 10 1 9.32843 1 8.5V3.5ZM6 2.5C6 1.67157 6.67157 1 7.5 1H8.5C9.32843 1 10 1.67157 10 2.5V8.5C10 9.32843 9.32843 10 8.5 10H7.5C6.67157 10 6 9.32843 6 8.5V2.5ZM11 1.5C11 0.671573 11.6716 0 12.5 0H13.5C14.3284 0 15 0.671573 15 1.5V8.5C15 9.32843 14.3284 10 13.5 10H12.5C11.6716 10 11 9.32843 11 8.5V1.5Z"
                fill="currentColor"
              />
            </svg>
            <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M7.5 2.5C10.5 2.5 12.7 4.2 13.5 6.5C12.7 8.8 10.5 10.5 7.5 10.5C4.5 10.5 2.3 8.8 1.5 6.5C2.3 4.2 4.5 2.5 7.5 2.5ZM7.5 8.5C8.88071 8.5 10 7.38071 10 6C10 4.61929 8.88071 3.5 7.5 3.5C6.11929 3.5 5 4.61929 5 6C5 7.38071 6.11929 8.5 7.5 8.5Z"
                fill="currentColor"
              />
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
              <rect x="1" y="1" width="21" height="10" rx="2.5" stroke="currentColor" stroke-width="1.2" />
              <rect x="23" y="4" width="1.5" height="4" rx="0.5" fill="currentColor" />
              <rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor" />
            </svg>
          </span>
        </header>

        <nav class="nav" aria-label="Conversation">
          <button type="button" class="nav__btn" aria-label="Open menu">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
              <rect y="1" width="18" height="1.5" rx="0.75" fill="currentColor" />
              <rect y="6.25" width="18" height="1.5" rx="0.75" fill="currentColor" />
              <rect y="11.5" width="18" height="1.5" rx="0.75" fill="currentColor" />
            </svg>
          </button>
          <button type="button" class="nav__title" aria-haspopup="listbox">
            <span class="nav__title-text">ChatGPT 5</span>
            <svg class="nav__chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="nav__right">
            <button type="button" class="nav__btn" aria-label="New chat">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path
                  d="M4.5 4.5H13.5V13.5H4.5V4.5Z"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                />
                <path d="M6.5 13.5V15.5H15.5V6.5H13.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
              </svg>
            </button>
            <button type="button" class="nav__btn" aria-label="More options">
              <svg width="18" height="4" viewBox="0 0 18 4" fill="none" aria-hidden="true">
                <circle cx="2" cy="2" r="1.6" fill="currentColor" />
                <circle cx="9" cy="2" r="1.6" fill="currentColor" />
                <circle cx="16" cy="2" r="1.6" fill="currentColor" />
              </svg>
            </button>
          </div>
        </nav>

        <main class="main" id="mainScroll">
          <section class="entry" id="entryView" aria-label="Suggested prompts">
            <div class="entry__hero">
              <p class="entry__kicker">New chat</p>
              <h1 class="entry__headline">What are you looking for today?</h1>
            </div>
            <div class="entry__prompts" id="promptList"></div>
          </section>

          <section class="chat" id="chatView" hidden aria-live="polite"></section>
        </main>

        <footer class="composer">
          <div class="composer__row">
            <button type="button" class="composer__plus" aria-label="Add">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M9 3.5V14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                <path d="M3.5 9H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </button>
            <label class="composer__field" id="composerField">
              <span class="sr-only">Message</span>
              <textarea
                id="composerInput"
                rows="1"
                class="composer__input"
                placeholder="Ask anything"
                autocomplete="off"
                autocorrect="on"
                spellcheck="true"
              ></textarea>
              <button type="button" class="composer__send" id="composerSend" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path
                    d="M3.5 9L14.5 4L10 14L8.5 9.5L3.5 9Z"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="composer__mic" aria-label="Dictate">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path
                    d="M9 12.25C10.5188 12.25 11.75 11.0188 11.75 9.5V5.5C11.75 3.98122 10.5188 2.75 9 2.75C7.48122 2.75 6.25 3.98122 6.25 5.5V9.5C6.25 11.0188 7.48122 12.25 9 12.25Z"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path d="M4.25 8.25V9.5C4.25 12.1234 6.37665 14.25 9 14.25C11.6234 14.25 13.75 12.1234 13.75 9.5V8.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                  <path d="M9 14.25V16.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                </svg>
              </button>
            </label>
            <button type="button" class="composer__voice" aria-label="Voice mode">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M2 9H4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M13.5 9H16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M4.5 5.5L6.2 7.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M11.8 7.2L13.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M4.5 12.5L6.2 10.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path d="M11.8 10.8L13.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <circle cx="9" cy="9" r="3.25" stroke="currentColor" stroke-width="1.4" />
              </svg>
            </button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </footer>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
